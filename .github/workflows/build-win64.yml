name: Build iNFekt Win64 Portable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      # ============================================================
      # Checkout source
      # ============================================================
      - name: Checkout iNFekt
        uses: actions/checkout@v5

      # ============================================================
      # Verify Win32++
      # ============================================================
      - name: Verify Win32++
        shell: pwsh
        run: |
          $win32xx = "dependencies\include\win32xx"

          Write-Host "Checking Win32++..."
          Write-Host "Directory: $win32xx"

          if (-not (Test-Path $win32xx)) {
            Write-Error "Win32++ directory does not exist:"
            Write-Error $win32xx
            exit 1
          }

          $requiredHeaders = @(
            "wincore.h",
            "dialog.h",
            "docking.h",
            "frame.h",
            "gdi.h",
            "listview.h",
            "mdi.h",
            "propertysheet.h",
            "rebar.h",
            "socket.h",
            "statusbar.h",
            "toolbar.h",
            "treeview.h"
          )

          $missing = @()

          foreach ($header in $requiredHeaders) {
            $path = Join-Path $win32xx $header

            if (Test-Path $path) {
              $size = (Get-Item $path).Length
              Write-Host "OK    $header ($size bytes)"
            }
            else {
              Write-Host "MISS  $header"
              $missing += $header
            }
          }

          if ($missing.Count -gt 0) {
            Write-Error "Missing Win32++ headers:"
            Write-Error ($missing -join ", ")
            exit 1
          }

          $splitter = Join-Path $win32xx "splitter.h"

          if (Test-Path $splitter) {
            Write-Host "OK    splitter.h"
            "SPLITTER_PRESENT=true" >> $env:GITHUB_ENV
          }
          else {
            Write-Host "INFO  splitter.h is not present"
            "SPLITTER_PRESENT=false" >> $env:GITHUB_ENV
          }

          Write-Host ""
          Write-Host "Win32++ verification successful."

      # ============================================================
      # Handle missing splitter.h
      # ============================================================
      - name: Handle missing splitter.h
        shell: pwsh
        run: |
          if ($env:SPLITTER_PRESENT -eq "true") {
            Write-Host "splitter.h exists. No patch required."
            exit 0
          }

          Write-Host "splitter.h is missing."
          Write-Host "Checking whether CSplitter is actually used..."

          $sourceRoot = Join-Path $PWD "src"

          $splitterUsage = Get-ChildItem `
            -Path $sourceRoot `
            -Recurse `
            -File `
            -Include *.h,*.hpp,*.c,*.cc,*.cpp |
            Select-String `
              -Pattern '\bCSplitter\b' `
              -CaseSensitive `
              -SimpleMatch:$false

          $actualUsage = @(
            $splitterUsage | Where-Object {
              -not (
                $_.Path.EndsWith("stdafx.h") -and
                $_.Line -match '#include\s*[<"]splitter\.h[>"]'
              )
            }
          )

          if ($actualUsage.Count -gt 0) {
            Write-Host ""
            Write-Host "CSplitter usage found:"
            $actualUsage | ForEach-Object {
              Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())"
            }

            Write-Error "splitter.h is actually required by the source."
            exit 1
          }

          $stdafx = "src\win32\stdafx.h"

          if (-not (Test-Path $stdafx)) {
            Write-Error "stdafx.h not found."
            exit 1
          }

          $content = Get-Content $stdafx -Raw

          $pattern = '(?m)^\s*#include\s*[<"]splitter\.h[>"]\s*\r?\n?'

          $patched = [regex]::Replace(
            $content,
            $pattern,
            "// splitter.h omitted: CSplitter is unused by this source tree.`r`n"
          )

          Set-Content `
            -Path $stdafx `
            -Value $patched `
            -Encoding utf8

          Write-Host "Unused splitter.h include removed from CI workspace."

      # ============================================================
      # Install Boost 1.82.0
      # ============================================================
      - name: Install Boost 1.82.0
        shell: pwsh
        run: |
          $url = "https://archives.boost.io/release/1.82.0/source/boost_1_82_0.zip"
          $zip = "$env:RUNNER_TEMP\boost_1_82_0.zip"
          $installRoot = "C:\Dev"
          $boostRoot = "C:\Dev\boost"

          Write-Host "Downloading Boost 1.82.0..."

          curl.exe `
            -L `
            --fail `
            --retry 5 `
            --retry-delay 3 `
            -A "Mozilla/5.0" `
            -o $zip `
            $url

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Boost download failed."
            exit 1
          }

          if (-not (Test-Path $zip)) {
            Write-Error "Boost archive was not downloaded."
            exit 1
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $installRoot | Out-Null

          if (Test-Path $boostRoot) {
            Remove-Item `
              -Path $boostRoot `
              -Recurse `
              -Force
          }

          Write-Host "Extracting Boost..."

          Expand-Archive `
            -Path $zip `
            -DestinationPath $installRoot `
            -Force

          $boostHeader = Get-ChildItem `
            -Path $installRoot `
            -Recurse `
            -File `
            -Filter "format.hpp" |
            Where-Object {
              $_.FullName -match '\\boost\\format\.hpp$'
            } |
            Select-Object -First 1

          if (-not $boostHeader) {
            Write-Error "Could not locate Boost after extraction."
            exit 1
          }

          $extractedBoostRoot = $boostHeader.Directory.Parent.FullName

          Write-Host "Detected Boost root:"
          Write-Host $extractedBoostRoot

          Rename-Item `
            -Path $extractedBoostRoot `
            -NewName "boost"

          $finalHeader = "$boostRoot\boost\format.hpp"

          if (-not (Test-Path $finalHeader)) {
            Write-Error "Boost installation failed."
            Write-Error $finalHeader
            exit 1
          }

          Write-Host ""
          Write-Host "Boost 1.82.0 installed successfully:"
          Get-Item $finalHeader |
            Format-List FullName,Length

      # ============================================================
      # Setup vcpkg
      #
      # We use the current vcpkg static Windows triplet.
      # ============================================================
      - name: Setup vcpkg
        shell: pwsh
        run: |
          $candidatePaths = @(
            "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe",
            "C:\vcpkg\vcpkg.exe"
          )

          $vcpkgExe = $candidatePaths |
            Where-Object {
              $_ -and (Test-Path $_)
            } |
            Select-Object -First 1

          if (-not $vcpkgExe) {
            Write-Host "vcpkg not found on runner. Cloning..."

            $vcpkgRoot = "C:\vcpkg"

            if (Test-Path $vcpkgRoot) {
              Remove-Item `
                -Path $vcpkgRoot `
                -Recurse `
                -Force
            }

            git clone `
              --depth 1 `
              https://github.com/microsoft/vcpkg.git `
              $vcpkgRoot

            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to clone vcpkg."
              exit 1
            }

            & "$vcpkgRoot\bootstrap-vcpkg.bat" `
              -disableMetrics

            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to bootstrap vcpkg."
              exit 1
            }

            $vcpkgExe = "$vcpkgRoot\vcpkg.exe"
          }

          $vcpkgRoot = Split-Path `
            $vcpkgExe `
            -Parent

          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          "VCPKG_EXE=$vcpkgExe" >> $env:GITHUB_ENV

          Write-Host "vcpkg:"
          Write-Host $vcpkgExe

          & $vcpkgExe version

      # ============================================================
      # Build static Cairo + dependencies
      #
      # Cairo is installed with [core] so vcpkg does NOT enable its
      # default fontconfig/freetype features.
      #
      # This still brings the static dependencies required by Cairo:
      #   libpng
      #   pixman
      #   zlib
      #   and the small Windows support libraries used by the port.
      # ============================================================
      - name: Build static Cairo dependencies
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "Installing Cairo core as x64-windows-static..."

          & $env:VCPKG_EXE `
            install `
            "cairo[core]:x64-windows-static" `
            --disable-metrics

          if ($LASTEXITCODE -ne 0) {
            Write-Error "vcpkg Cairo installation failed."
            exit 1
          }

          $tripletRoot = Join-Path `
            $env:VCPKG_ROOT `
            "installed\x64-windows-static"

          $libRoot = Join-Path $tripletRoot "lib"
          $includeRoot = Join-Path $tripletRoot "include"

          if (-not (Test-Path $libRoot)) {
            Write-Error "vcpkg static library directory not found:"
            Write-Error $libRoot
            exit 1
          }

          if (-not (Test-Path $includeRoot)) {
            Write-Error "vcpkg include directory not found:"
            Write-Error $includeRoot
            exit 1
          }

          # ----------------------------------------------------------
          # Copy all generated headers into the project's dependency
          # include directory.
          # ----------------------------------------------------------
          $projectInclude = "dependencies\include"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $projectInclude | Out-Null

          Copy-Item `
            "$includeRoot\*" `
            $projectInclude `
            -Recurse `
            -Force

          # ----------------------------------------------------------
          # Copy all release static libraries.
          # ----------------------------------------------------------
          $projectLib = "dependencies\lib_x64_static"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $projectLib | Out-Null

          $libs = Get-ChildItem `
            -Path $libRoot `
            -Filter "*.lib" `
            -File

          if ($libs.Count -eq 0) {
            Write-Error "No static libraries were produced by vcpkg."
            exit 1
          }

          foreach ($lib in $libs) {
            Copy-Item `
              -Path $lib.FullName `
              -Destination $projectLib `
              -Force

            Write-Host "Copied $($lib.Name)"
          }

          # ----------------------------------------------------------
          # The iNFekt VCXPROJ expects cairo-static.lib.
          #
          # vcpkg's static Cairo library is named cairo.lib.
          # ----------------------------------------------------------
          $cairo = Join-Path $projectLib "cairo.lib"
          $cairoStatic = Join-Path $projectLib "cairo-static.lib"

          if (-not (Test-Path $cairo)) {
            Write-Error "vcpkg did not produce cairo.lib"
            exit 1
          }

          if (Test-Path $cairoStatic) {
            Remove-Item $cairoStatic -Force
          }

          Rename-Item `
            -Path $cairo `
            -NewName "cairo-static.lib"

          Write-Host ""
          Write-Host "Static Cairo renamed to:"
          Write-Host $cairoStatic

          # ----------------------------------------------------------
          # Verify required libraries.
          # ----------------------------------------------------------
          $required = @(
            "cairo-static.lib",
            "libpng16.lib",
            "zlib.lib",
            "pixman-1.lib"
          )

          $missing = @()

          foreach ($lib in $required) {
            $path = Join-Path $projectLib $lib

            if (Test-Path $path) {
              Write-Host "OK    $lib"
            }
            else {
              Write-Host "MISS  $lib"
              $missing += $lib
            }
          }

          if ($missing.Count -gt 0) {
            Write-Error "Required static libraries are missing:"
            Write-Error ($missing -join ", ")
            exit 1
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Cairo static dependency build complete"
          Write-Host "========================================"

      # ============================================================
      # Patch Release-Static|x64 linker dependencies
      #
      # The original project only lists:
      #   cairo-static.lib
      #   zlib.lib
      #   libpng16.lib
      #
      # A modern static Cairo archive also has transitive static
      # dependencies such as pixman. Add every static library
      # generated in this vcpkg installation to the Release-Static
      # x64 linker input.
      #
      # This changes only the CI workspace, not the repository.
      # ============================================================
      - name: Configure static linker dependencies
        shell: pwsh
        run: |
          $projectFile = "project\infekt-win32\iNFekt.vcxproj"
          $libDir = (Resolve-Path "dependencies\lib_x64_static").Path

          if (-not (Test-Path $projectFile)) {
            Write-Error "VCXPROJ not found:"
            Write-Error $projectFile
            exit 1
          }

          $libraryNames = @(
            Get-ChildItem `
              -Path $libDir `
              -Filter "*.lib" `
              -File |
            Select-Object -ExpandProperty Name
          )

          if ($libraryNames.Count -eq 0) {
            Write-Error "No libraries found in $libDir"
            exit 1
          }

          $libraryNames = $libraryNames |
            Sort-Object -Unique

          # Windows system libraries needed by Cairo / Win32.
          $systemLibraries = @(
            "advapi32.lib",
            "comctl32.lib",
            "gdi32.lib",
            "imm32.lib",
            "kernel32.lib",
            "msimg32.lib",
            "ole32.lib",
            "oleaut32.lib",
            "shlwapi.lib",
            "uxtheme.lib",
            "user32.lib",
            "uuid.lib",
            "winhttp.lib",
            "winmm.lib"
          )

          $allDependencies = @(
            $libraryNames
            $systemLibraries
          ) |
            Sort-Object -Unique

          $dependencyText =
            ($allDependencies -join ";") +
            ";%(AdditionalDependencies)"

          $xml = Get-Content `
            -Path $projectFile `
            -Raw

          $pattern = '(?s)(<ItemDefinitionGroup\s+Condition="' +
                     "'\`$(Configuration)\|\`$(Platform)'=='Release-Static\|x64'" +
                     '">.*?<Link>\s*)' +
                     '<AdditionalDependencies>.*?</AdditionalDependencies>'

          $replacement =
            '${1}<AdditionalDependencies>' +
            $dependencyText +
            '</AdditionalDependencies>'

          $updated = [regex]::Replace(
            $xml,
            $pattern,
            $replacement,
            1
          )

          if ($updated -eq $xml) {
            Write-Error "Could not locate Release-Static|x64 Link block."
            exit 1
          }

          Set-Content `
            -Path $projectFile `
            -Value $updated `
            -Encoding utf8

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Static linker dependencies configured"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "Libraries passed to linker:"
          $allDependencies | ForEach-Object {
            Write-Host "  $_"
          }

      # ============================================================
      # Verify generated libraries
      # ============================================================
      - name: Verify generated libraries
        shell: pwsh
        run: |
          $libDir = "dependencies\lib_x64_static"

          $required = @(
            "cairo-static.lib",
            "libpng16.lib",
            "zlib.lib",
            "pixman-1.lib"
          )

          foreach ($lib in $required) {
            $path = Join-Path $libDir $lib

            if (-not (Test-Path $path)) {
              Write-Error "Missing:"
              Write-Error $path
              exit 1
            }

            $size = (Get-Item $path).Length
            Write-Host "OK    $lib ($size bytes)"
          }

      # ============================================================
      # Setup MSBuild
      # ============================================================
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      # ============================================================
      # Build
      # ============================================================
      - name: Build iNFekt
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "Building iNFekt"
          Write-Host "Configuration : Release-Static"
          Write-Host "Platform      : x64"
          Write-Host "Toolset       : v143"
          Write-Host "========================================"

          msbuild `
            project/infekt-win32/iNFekt.vcxproj `
            /m `
            /p:Configuration=Release-Static `
            /p:Platform=x64 `
            /p:PlatformToolset=v143 `
            /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
            Write-Error "MSBuild failed."
            exit 1
          }

      # ============================================================
      # Verify executable
      # ============================================================
      - name: Verify build
        shell: pwsh
        run: |
          $exe = "project\build-out\Release-Static-x64\infekt-win64.exe"

          Write-Host ""
          Write-Host "Checking:"
          Write-Host $exe

          if (-not (Test-Path $exe)) {
            Write-Error "infekt-win64.exe was not produced."

            Write-Host ""
            Write-Host "Build output:"

            if (Test-Path "project\build-out") {
              Get-ChildItem `
                -Path "project\build-out" `
                -Recurse `
                -File |
                Select-Object FullName,Length
            }

            exit 1
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "BUILD SUCCESSFUL"
          Write-Host "========================================"

          Get-Item $exe |
            Format-List FullName,Length

      # ============================================================
      # Package portable ZIP
      # ============================================================
      - name: Package portable ZIP
        shell: pwsh
        run: |
          $src = "project\build-out\Release-Static-x64"
          $zip = "iNFekt-win64-portable.zip"

          if (-not (Test-Path "$src\infekt-win64.exe")) {
            Write-Error "Executable not found."
            exit 1
          }

          Compress-Archive `
            -Path "$src\*" `
            -DestinationPath $zip `
            -Force

          if (-not (Test-Path $zip)) {
            Write-Error "Failed to create portable ZIP."
            exit 1
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "PORTABLE PACKAGE CREATED"
          Write-Host "========================================"

          Get-Item $zip |
            Format-List FullName,Length

      # ============================================================
      # Upload artifact
      # ============================================================
      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: iNFekt-win64-portable
          path: iNFekt-win64-portable.zip
          if-no-files-found: error
