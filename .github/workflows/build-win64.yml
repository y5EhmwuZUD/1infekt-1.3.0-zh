name: Build iNFekt Win64 Portable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v5

      # ============================================================
      # 2. Obtain Win32++ 7.6.1 from GitHub mirror history
      #
      # Do NOT use SourceForge.
      #
      # DavidNash2024/Win32xx is a GitHub mirror of the official
      # SourceForge Win32++ project.
      #
      # We locate the historical commit containing "7.6.1" and
      # extract only the include directory from that exact commit.
      # ============================================================
      - name: Install Win32++ 7.6.1 from GitHub mirror
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $target = Join-Path `
            $PWD `
            "dependencies\include\win32xx"

          $tmpRoot = Join-Path `
            $env:RUNNER_TEMP `
            "win32xx-github"

          $mirrorRoot = Join-Path `
            $tmpRoot `
            "repo"

          $archive = Join-Path `
            $tmpRoot `
            "win32xx761-include.zip"

          Write-Host "=================================================="
          Write-Host "Obtaining Win32++ 7.6.1 from GitHub mirror"
          Write-Host "=================================================="
          Write-Host "Mirror:"
          Write-Host "https://github.com/DavidNash2024/Win32xx"
          Write-Host ""

          if (Test-Path $tmpRoot) {
            Remove-Item `
              -Path $tmpRoot `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $tmpRoot `
            -Force | Out-Null

          # --------------------------------------------------------
          # Clone GitHub mirror.
          #
          # Do a full clone because we need historical 2014 commits.
          # The repository is small enough for a GitHub Actions runner.
          # --------------------------------------------------------
          Write-Host "Cloning Win32++ mirror..."

          & git clone `
            --quiet `
            "https://github.com/DavidNash2024/Win32xx.git" `
            $mirrorRoot

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clone GitHub Win32++ mirror."
          }

          Write-Host "GitHub mirror cloned successfully."
          Write-Host ""

          # --------------------------------------------------------
          # First try an explicit version tag.
          # --------------------------------------------------------
          $tag = $null

          $tags = @(
            & git -C $mirrorRoot tag --list "v7.6.1"
            & git -C $mirrorRoot tag --list "7.6.1"
            & git -C $mirrorRoot tag --list "*7.6.1*"
          ) |
            Where-Object { $_ -and $_.Trim().Length -gt 0 } |
            Select-Object -First 1

          if ($tags) {
            $tag = $tags.Trim()
            Write-Host "Found tag:"
            Write-Host $tag
          }

          # --------------------------------------------------------
          # If no tag exists, search historical changes.txt commits.
          # --------------------------------------------------------
          $commit = $null

          if ($tag) {
            $commit = (
              & git -C $mirrorRoot rev-list -n 1 $tag
            ).Trim()
          }

          if (-not $commit) {
            Write-Host ""
            Write-Host "No direct 7.6.1 tag found."
            Write-Host "Searching Git history for Version 7.6.1..."

            $commitCandidates = @(
              & git -C $mirrorRoot `
                log `
                --all `
                --format="%H" `
                -S "7.6.1" `
                -- `
                include/changes.txt
            )

            $commit = $commitCandidates |
              Where-Object { $_ -and $_.Trim().Length -gt 0 } |
              Select-Object -First 1
          }

          # --------------------------------------------------------
          # Broader fallback search.
          # --------------------------------------------------------
          if (-not $commit) {
            Write-Host ""
            Write-Host "Exact string search did not find 7.6.1."
            Write-Host "Trying broader historical search..."

            $commitCandidates = @(
              & git -C $mirrorRoot `
                log `
                --all `
                --format="%H" `
                -G "7\.6\.1" `
                -- `
                include
            )

            $commit = $commitCandidates |
              Where-Object { $_ -and $_.Trim().Length -gt 0 } |
              Select-Object -First 1
          }

          if (-not $commit) {
            Write-Host ""
            Write-Host "Available historical Win32++ commits around the old versions:"
            & git -C $mirrorRoot log `
              --all `
              --date=short `
              --format="%h %ad %s" `
              -- include/changes.txt |
              Select-Object -First 50

            throw "Could not locate Win32++ 7.6.1 in the GitHub mirror history."
          }

          $commit = $commit.Trim()

          Write-Host ""
          Write-Host "Selected Win32++ historical commit:"
          Write-Host $commit
          Write-Host ""

          & git -C $mirrorRoot show `
            -s `
            --date=iso `
            --format="%H%n%ad%n%s%n" `
            $commit

          if ($LASTEXITCODE -ne 0) {
            throw "Selected Win32++ commit is invalid."
          }

          # --------------------------------------------------------
          # Export only the include directory from the historical
          # commit.
          # --------------------------------------------------------
          Write-Host "Creating historical include archive..."

          & git -C $mirrorRoot archive `
            --format=zip `
            --output="$archive" `
            $commit `
            include

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create Win32++ historical include archive."
          }

          if (-not (Test-Path $archive)) {
            throw "Win32++ historical archive was not created."
          }

          $archiveSize = (Get-Item $archive).Length

          Write-Host "Archive size: $archiveSize bytes"

          if ($archiveSize -lt 500000) {
            throw "Historical Win32++ archive is unexpectedly small."
          }

          # --------------------------------------------------------
          # Extract.
          # --------------------------------------------------------
          $extractRoot = Join-Path `
            $tmpRoot `
            "extract"

          if (Test-Path $extractRoot) {
            Remove-Item `
              -Path $extractRoot `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $extractRoot `
            -Force | Out-Null

          Expand-Archive `
            -Path $archive `
            -DestinationPath $extractRoot `
            -Force

          # --------------------------------------------------------
          # Locate wincore.h.
          # --------------------------------------------------------
          $wincore = Get-ChildItem `
            -Path $extractRoot `
            -Recurse `
            -File `
            -Filter "wincore.h" |
            Select-Object -First 1

          if (-not $wincore) {
            throw "Selected Win32++ historical commit does not contain wincore.h."
          }

          $sourceInclude = $wincore.Directory.FullName

          Write-Host ""
          Write-Host "Detected Win32++ include directory:"
          Write-Host $sourceInclude

          # --------------------------------------------------------
          # Verify legacy headers required by iNFekt.
          # --------------------------------------------------------
          $requiredHeaders = @(
            "wincore.h",
            "dialog.h",
            "docking.h",
            "frame.h",
            "gdi.h",
            "listview.h",
            "mdi.h",
            "propertysheet.h",
            "rebar.h",
            "socket.h",
            "statusbar.h",
            "toolbar.h",
            "treeview.h"
          )

          $missing = @()

          Write-Host ""
          Write-Host "Checking required Win32++ headers..."
          Write-Host ""

          foreach ($header in $requiredHeaders) {
            $path = Join-Path `
              $sourceInclude `
              $header

            if (Test-Path $path) {
              $size = (Get-Item $path).Length
              Write-Host "OK    $header ($size bytes)"
            }
            else {
              Write-Host "MISS  $header"
              $missing += $header
            }
          }

          if ($missing.Count -gt 0) {
            throw (
              "Win32++ 7.6.1 historical include tree is missing: " +
              ($missing -join ", ")
            )
          }

          # --------------------------------------------------------
          # Replace repository Win32++ headers in CI workspace only.
          # --------------------------------------------------------
          if (Test-Path $target) {
            Remove-Item `
              -Path $target `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $target `
            -Force | Out-Null

          Copy-Item `
            -Path "$sourceInclude\*" `
            -Destination $target `
            -Recurse `
            -Force

          Write-Host ""
          Write-Host "Win32++ 7.6.1 historical snapshot installed."
          Write-Host ""

          Get-Item `
            (Join-Path $target "wincore.h") |
            Format-List FullName,Length,LastWriteTime

      # ============================================================
      # 3. Remove unused splitter.h include
      #
      # Win32++ 7.0.x/7.6.x layouts can differ here.
      # iNFekt does not actually use CSplitter, so only remove the
      # include when there is no real CSplitter usage.
      # ============================================================
      - name: Remove unused splitter.h include when safe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $stdafx = Join-Path `
            $PWD `
            "src\win32\stdafx.h"

          if (-not (Test-Path $stdafx)) {
            throw "stdafx.h not found: $stdafx"
          }

          $sourceFiles = Get-ChildItem `
            (Join-Path $PWD "src") `
            -Recurse `
            -File `
            -Include *.h,*.hpp,*.cpp,*.c

          $realUsage = @(
            $sourceFiles |
              Select-String `
                -Pattern '\bCSplitter\b' |
              Where-Object {
                $_.Path -ne $stdafx
              }
          )

          if ($realUsage.Count -gt 0) {
            Write-Host "CSplitter usage detected. Keeping splitter.h include."
          }
          else {
            $text = Get-Content `
              -Path $stdafx `
              -Raw

            $newText = $text -replace `
              '(?m)^\s*#\s*include\s*[<"]splitter\.h[>"].*\r?\n', `
              ''

            if ($newText -ne $text) {
              Set-Content `
                -Path $stdafx `
                -Value $newText `
                -Encoding utf8

              Write-Host "Removed unused splitter.h include."
            }
            else {
              Write-Host "No splitter.h include was found."
            }
          }

      # ============================================================
      # 4. Boost 1.82
      # ============================================================
      - name: Install Boost 1.82
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $boostZip = Join-Path `
            $env:RUNNER_TEMP `
            "boost_1_82_0.zip"

          $boostExtract = Join-Path `
            $env:RUNNER_TEMP `
            "boost_1_82_0"

          $boostFinal = "C:\Dev\boost"

          Write-Host "Downloading Boost 1.82..."

          curl.exe `
            -L `
            --fail `
            --retry 3 `
            --retry-delay 2 `
            --connect-timeout 30 `
            --max-time 600 `
            -o $boostZip `
            "https://archives.boost.io/release/1.82.0/source/boost_1_82_0.zip"

          if ($LASTEXITCODE -ne 0) {
            throw "Boost download failed."
          }

          if (Test-Path $boostExtract) {
            Remove-Item `
              $boostExtract `
              -Recurse `
              -Force
          }

          Expand-Archive `
            -Path $boostZip `
            -DestinationPath $env:RUNNER_TEMP `
            -Force

          $boostRoot = Join-Path `
            $env:RUNNER_TEMP `
            "boost_1_82_0"

          $boostHeader = Join-Path `
            $boostRoot `
            "boost\format.hpp"

          if (-not (Test-Path $boostHeader)) {
            throw "Boost 1.82 format.hpp not found."
          }

          if (Test-Path $boostFinal) {
            Remove-Item `
              $boostFinal `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "C:\Dev" `
            -Force | Out-Null

          Move-Item `
            -Path $boostRoot `
            -Destination $boostFinal

          Write-Host ""
          Write-Host "Boost installed:"
          Write-Host "C:\Dev\boost\boost\format.hpp"

      # ============================================================
      # 5. vcpkg / Cairo static dependencies
      # ============================================================
      - name: Install Cairo static dependencies with vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vcpkg = (Get-Command vcpkg -ErrorAction Stop).Source

          Write-Host "Using vcpkg:"
          Write-Host $vcpkg
          Write-Host ""

          & $vcpkg install `
            "cairo[core]:x64-windows-static" `
            --disable-metrics

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg Cairo installation failed."
          }

      # ============================================================
      # 6. Prepare Cairo / zlib / libpng headers and libraries
      # ============================================================
      - name: Prepare Cairo and legacy library names
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $depInclude = Join-Path `
            $PWD `
            "dependencies\include"

          $depLib = Join-Path `
            $PWD `
            "dependencies\lib_x64_static"

          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT

          if (-not $vcpkgRoot) {
            $vcpkgRoot = "C:\vcpkg"
          }

          $tripletRoot = Join-Path `
            $vcpkgRoot `
            "installed\x64-windows-static"

          $includeRoot = Join-Path `
            $tripletRoot `
            "include"

          $libRoot = Join-Path `
            $tripletRoot `
            "lib"

          if (-not (Test-Path $includeRoot)) {
            throw "vcpkg include directory not found: $includeRoot"
          }

          if (-not (Test-Path $libRoot)) {
            throw "vcpkg library directory not found: $libRoot"
          }

          if (-not (Test-Path $depInclude)) {
            New-Item `
              -ItemType Directory `
              -Path $depInclude `
              -Force | Out-Null
          }

          if (-not (Test-Path $depLib)) {
            New-Item `
              -ItemType Directory `
              -Path $depLib `
              -Force | Out-Null
          }

          # --------------------------------------------------------
          # Copy complete vcpkg include tree.
          # --------------------------------------------------------
          Copy-Item `
            -Path "$includeRoot\*" `
            -Destination $depInclude `
            -Recurse `
            -Force

          # --------------------------------------------------------
          # Legacy iNFekt expects cairo-win32.h directly below
          # dependencies\include rather than dependencies\include\cairo.
          # --------------------------------------------------------
          $cairoInclude = Join-Path `
            $includeRoot `
            "cairo"

          if (Test-Path $cairoInclude) {
            Copy-Item `
              -Path "$cairoInclude\*.h" `
              -Destination $depInclude `
              -Force
          }

          # --------------------------------------------------------
          # Copy all static libraries.
          # --------------------------------------------------------
          Copy-Item `
            -Path "$libRoot\*.lib" `
            -Destination $depLib `
            -Force

          # --------------------------------------------------------
          # Convert modern vcpkg names to legacy project names.
          #
          # Cairo:
          #   cairo.lib -> cairo-static.lib
          #
          # zlib:
          #   zs.lib -> zlib.lib
          # --------------------------------------------------------
          $cairoModern = Join-Path `
            $depLib `
            "cairo.lib"

          $cairoLegacy = Join-Path `
            $depLib `
            "cairo-static.lib"

          if (Test-Path $cairoModern) {
            if (Test-Path $cairoLegacy) {
              Remove-Item $cairoLegacy -Force
            }

            Move-Item `
              -Path $cairoModern `
              -Destination $cairoLegacy
          }

          $zlibModern = Join-Path `
            $depLib `
            "zs.lib"

          $zlibLegacy = Join-Path `
            $depLib `
            "zlib.lib"

          if (Test-Path $zlibModern) {
            if (Test-Path $zlibLegacy) {
              Remove-Item $zlibLegacy -Force
            }

            Move-Item `
              -Path $zlibModern `
              -Destination $zlibLegacy
          }

          # --------------------------------------------------------
          # Verify required headers.
          # --------------------------------------------------------
          $requiredHeaders = @(
            "cairo-win32.h"
          )

          foreach ($header in $requiredHeaders) {
            $path = Join-Path `
              $depInclude `
              $header

            if (-not (Test-Path $path)) {
              throw "Required dependency header missing: $path"
            }

            Write-Host "OK header: $header"
          }

          # --------------------------------------------------------
          # Verify required libraries.
          # --------------------------------------------------------
          $requiredLibs = @(
            "cairo-static.lib",
            "libpng16.lib",
            "zlib.lib",
            "pixman-1.lib"
          )

          foreach ($lib in $requiredLibs) {
            $path = Join-Path `
              $depLib `
              $lib

            if (-not (Test-Path $path)) {
              throw "Required dependency library missing: $path"
            }

            Write-Host "OK library: $lib"
          }

          Write-Host ""
          Write-Host "Prepared dependency libraries:"
          Get-ChildItem `
            $depLib `
            -Filter *.lib |
            Sort-Object Name |
            Select-Object Name,Length

      # ============================================================
      # 7. Patch VCXPROJ library dependencies
      # ============================================================
      - name: Patch iNFekt library dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $project = Join-Path `
            $PWD `
            "project\infekt-win32\iNFekt.vcxproj"

          $depLib = Join-Path `
            $PWD `
            "dependencies\lib_x64_static"

          if (-not (Test-Path $project)) {
            throw "Project file not found: $project"
          }

          if (-not (Test-Path $depLib)) {
            throw "Dependency library directory not found: $depLib"
          }

          $dependencyLibs = @(
            Get-ChildItem `
              $depLib `
              -Filter *.lib `
              -File |
            ForEach-Object {
              $_.Name
            }
          )

          if ($dependencyLibs.Count -eq 0) {
            throw "No dependency libraries found."
          }

          $systemLibs = @(
            "advapi32.lib",
            "comctl32.lib",
            "gdi32.lib",
            "imm32.lib",
            "kernel32.lib",
            "msimg32.lib",
            "ole32.lib",
            "oleaut32.lib",
            "shlwapi.lib",
            "uxtheme.lib",
            "user32.lib",
            "uuid.lib",
            "winhttp.lib",
            "winmm.lib"
          )

          $allLibs = @(
            $dependencyLibs
            $systemLibs
          ) |
            Select-Object -Unique

          $linkDependencies = (
            $allLibs + @(
              "%(AdditionalDependencies)"
            )
          ) -join ";"

          Write-Host "Link libraries:"
          Write-Host $linkDependencies
          Write-Host ""

          $text = Get-Content `
            -Path $project `
            -Raw

          $pattern = '<AdditionalDependencies>[^<]*</AdditionalDependencies>'

          $replacement =
            "<AdditionalDependencies>$linkDependencies</AdditionalDependencies>"

          $newText = [regex]::Replace(
            $text,
            $pattern,
            $replacement
          )

          if ($newText -eq $text) {
            throw "Could not patch AdditionalDependencies in VCXPROJ."
          }

          Set-Content `
            -Path $project `
            -Value $newText `
            -Encoding utf8

          Write-Host "VCXPROJ library dependencies patched."

      # ============================================================
      # 8. Setup MSBuild
      # ============================================================
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      # ============================================================
      # 9. Build
      # ============================================================
      - name: Build Release-Static x64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $project = Join-Path `
            $PWD `
            "project\infekt-win32\iNFekt.vcxproj"

          if (-not (Test-Path $project)) {
            throw "iNFekt.vcxproj not found."
          }

          Write-Host "Building:"
          Write-Host $project
          Write-Host ""

          & msbuild `
            $project `
            /m `
            /p:Configuration=Release-Static `
            /p:Platform=x64 `
            /p:PlatformToolset=v143

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed."
          }

      # ============================================================
      # 10. Locate and verify executable
      # ============================================================
      - name: Verify executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $candidates = @(
            Join-Path $PWD "project\build-out\Release-Static-x64\infekt-win64.exe"
            Join-Path $PWD "project\build-out\Release-Static\x64\infekt-win64.exe"
            Join-Path $PWD "project\infekt-win32\x64\Release-Static\infekt-win64.exe"
          )

          $exe = $null

          foreach ($candidate in $candidates) {
            if (Test-Path $candidate) {
              $exe = $candidate
              break
            }
          }

          if (-not $exe) {
            Write-Host "Known output paths were not found."
            Write-Host "Searching entire workspace..."

            $exe = (
              Get-ChildItem `
                $PWD `
                -Recurse `
                -File `
                -Filter "infekt-win64.exe" |
              Select-Object -First 1
            )?.FullName
          }

          if (-not $exe) {
            throw "infekt-win64.exe was not found."
          }

          Write-Host ""
          Write-Host "Executable found:"
          Write-Host $exe
          Write-Host ""

          $item = Get-Item $exe

          Write-Host "Path   : $($item.FullName)"
          Write-Host "Size   : $($item.Length) bytes"
          Write-Host "Modified: $($item.LastWriteTime)"

          # Export path to the next step.
          "INFekt_EXE=$($item.FullName)" >> $env:GITHUB_ENV

      # ============================================================
      # 11. Package portable EXE
      # ============================================================
      - name: Package portable build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:INFekt_EXE) {
            throw "INFekt_EXE environment variable is missing."
          }

          $dist = Join-Path `
            $PWD `
            "dist"

          if (Test-Path $dist) {
            Remove-Item `
              $dist `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $dist `
            -Force | Out-Null

          $portableDir = Join-Path `
            $dist `
            "iNFekt-win64-portable"

          New-Item `
            -ItemType Directory `
            -Path $portableDir `
            -Force | Out-Null

          Copy-Item `
            -Path $env:INFekt_EXE `
            -Destination $portableDir `
            -Force

          $zip = Join-Path `
            $dist `
            "iNFekt-win64-portable.zip"

          Compress-Archive `
            -Path "$portableDir\*" `
            -DestinationPath $zip `
            -Force

          Write-Host ""
          Write-Host "Portable package:"
          Get-Item $zip |
            Format-List FullName,Length,LastWriteTime

      # ============================================================
      # 12. Upload GitHub Actions artifact
      # ============================================================
      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: iNFekt-win64-portable
          path: dist/iNFekt-win64-portable.zip
          if-no-files-found: error
