name: Build iNFekt Win64 Portable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v5


      # ==========================================================
      # 2. Install Win32++ 7.6.1
      #
      # Official SourceForge file:
      #   Win32xx761.zip
      #
      # Do NOT use GitHub tags here.
      # The DavidNash2024 GitHub repository does not expose
      # the old 7.x tags used by this legacy project.
      # ==========================================================
      - name: Install Win32++ 7.6.1
        shell: pwsh
        run: |
          $target = Join-Path $PWD "dependencies\include\win32xx"
          $tmpRoot = Join-Path $env:RUNNER_TEMP "win32xx-761"
          $zip = Join-Path $env:RUNNER_TEMP "Win32xx761.zip"

          Write-Host "Preparing Win32++ 7.6.1..."
          Write-Host "Target: $target"

          if (Test-Path $tmpRoot) {
            Remove-Item `
              -Path $tmpRoot `
              -Recurse `
              -Force
          }

          if (Test-Path $zip) {
            Remove-Item `
              -Path $zip `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $tmpRoot | Out-Null

          # SourceForge supports use_mirror=autoselect.
          # Try the downloads endpoint first, then the normal
          # SourceForge download endpoint.
          $urls = @(
            "https://downloads.sourceforge.net/project/win32-framework/Win32%2B%2B/Version%207.6.1/Win32xx761.zip?use_mirror=autoselect",
            "https://sourceforge.net/projects/win32-framework/files/Win32%2B%2B/Version%207.6.1/Win32xx761.zip/download?use_mirror=autoselect",
            "https://downloads.sourceforge.net/project/win32-framework/Win32%2B%2B/Version%207.6.1/Win32xx761.zip?viasf=1"
          )

          $downloaded = $false

          foreach ($url in $urls) {
            Write-Host ""
            Write-Host "Trying Win32++ download:"
            Write-Host $url

            if (Test-Path $zip) {
              Remove-Item `
                -Path $zip `
                -Force
            }

            curl.exe `
              -L `
              --fail `
              --retry 5 `
              --retry-delay 3 `
              --connect-timeout 20 `
              --max-time 300 `
              -A "Mozilla/5.0" `
              -o $zip `
              $url

            if ($LASTEXITCODE -eq 0 -and (Test-Path $zip)) {
              $size = (Get-Item $zip).Length

              Write-Host ""
              Write-Host "Download succeeded."
              Write-Host "Size: $size bytes"

              # Basic sanity check so a HTML error page is not
              # mistaken for the ZIP archive.
              if ($size -gt 500000) {
                $downloaded = $true
                break
              }

              Write-Host "Downloaded file is unexpectedly small."
              Remove-Item `
                -Path $zip `
                -Force
            }
            else {
              Write-Host "Download attempt failed."
            }
          }

          if (-not $downloaded) {
            Write-Error "Could not download Win32++ 7.6.1."
            exit 1
          }

          Write-Host ""
          Write-Host "Extracting Win32++ 7.6.1..."

          Expand-Archive `
            -Path $zip `
            -DestinationPath $tmpRoot `
            -Force

          # Locate the actual old-style Win32++ include folder.
          $wincore = Get-ChildItem `
            -Path $tmpRoot `
            -Recurse `
            -File `
            -Filter "wincore.h" |
            Select-Object -First 1

          if (-not $wincore) {
            Write-Error "Win32++ 7.6.1 archive does not contain wincore.h."
            exit 1
          }

          $sourceInclude = $wincore.Directory.FullName

          Write-Host ""
          Write-Host "Win32++ include directory:"
          Write-Host $sourceInclude

          $requiredHeaders = @(
            "wincore.h",
            "dialog.h",
            "docking.h",
            "frame.h",
            "gdi.h",
            "listview.h",
            "mdi.h",
            "propertysheet.h",
            "rebar.h",
            "socket.h",
            "statusbar.h",
            "toolbar.h",
            "treeview.h"
          )

          $missing = @()

          foreach ($header in $requiredHeaders) {
            $path = Join-Path $sourceInclude $header

            if (Test-Path $path) {
              $size = (Get-Item $path).Length
              Write-Host "OK    $header ($size bytes)"
            }
            else {
              Write-Host "MISS  $header"
              $missing += $header
            }
          }

          if ($missing.Count -gt 0) {
            Write-Error "Win32++ 7.6.1 is missing required legacy headers:"
            Write-Error ($missing -join ", ")
            exit 1
          }

          # Replace the repository's Win32++ 7.0.2 headers
          # in the CI workspace only.
          if (Test-Path $target) {
            Remove-Item `
              -Path $target `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $target | Out-Null

          Copy-Item `
            -Path "$sourceInclude\*" `
            -Destination $target `
            -Recurse `
            -Force

          Write-Host ""
          Write-Host "Win32++ 7.6.1 installed into CI workspace:"
          Write-Host $target

          Get-Item (Join-Path $target "wincore.h") |
            Format-List FullName,Length,LastWriteTime


      # ==========================================================
      # 3. Verify Win32++
      # ==========================================================
      - name: Verify Win32++
        shell: pwsh
        run: |
          $win32xx = "dependencies\include\win32xx"

          Write-Host "Checking Win32++..."
          Write-Host "Directory: $win32xx"

          if (-not (Test-Path $win32xx)) {
            Write-Error "Win32++ directory does not exist:"
            Write-Error $win32xx
            exit 1
          }

          $requiredHeaders = @(
            "wincore.h",
            "dialog.h",
            "docking.h",
            "frame.h",
            "gdi.h",
            "listview.h",
            "mdi.h",
            "propertysheet.h",
            "rebar.h",
            "socket.h",
            "statusbar.h",
            "toolbar.h",
            "treeview.h"
          )

          $missing = @()

          foreach ($header in $requiredHeaders) {
            $path = Join-Path $win32xx $header

            if (Test-Path $path) {
              $size = (Get-Item $path).Length
              Write-Host "OK    $header ($size bytes)"
            }
            else {
              Write-Host "MISS  $header"
              $missing += $header
            }
          }

          if ($missing.Count -gt 0) {
            Write-Error "Missing Win32++ headers:"
            Write-Error ($missing -join ", ")
            exit 1
          }

          $splitter = Join-Path $win32xx "splitter.h"

          if (Test-Path $splitter) {
            Write-Host "OK    splitter.h"
            "SPLITTER_PRESENT=true" >> $env:GITHUB_ENV
          }
          else {
            Write-Host "INFO  splitter.h is not present"
            "SPLITTER_PRESENT=false" >> $env:GITHUB_ENV
          }

          Write-Host ""
          Write-Host "Win32++ verification successful."


      # ==========================================================
      # 4. Handle missing splitter.h
      # ==========================================================
      - name: Handle missing splitter.h
        shell: pwsh
        run: |
          if ($env:SPLITTER_PRESENT -eq "true") {
            Write-Host "splitter.h exists. No patch required."
            exit 0
          }

          Write-Host "splitter.h is missing."
          Write-Host "Checking whether CSplitter is actually used..."

          $sourceRoot = Join-Path $PWD "src"

          $splitterUsage = Get-ChildItem `
            -Path $sourceRoot `
            -Recurse `
            -File `
            -Include *.h,*.hpp,*.c,*.cc,*.cpp |
            Select-String `
              -Pattern '\bCSplitter\b' `
              -CaseSensitive `
              -SimpleMatch:$false

          $actualUsage = @(
            $splitterUsage | Where-Object {
              -not (
                $_.Path.EndsWith("stdafx.h") -and
                $_.Line -match '#include\s*[<"]splitter\.h[>"]'
              )
            }
          )

          if ($actualUsage.Count -gt 0) {
            Write-Host ""
            Write-Host "CSplitter usage found:"

            $actualUsage | ForEach-Object {
              Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())"
            }

            Write-Error "splitter.h is actually required by the source."
            exit 1
          }

          $stdafx = "src\win32\stdafx.h"

          if (-not (Test-Path $stdafx)) {
            Write-Error "stdafx.h not found."
            exit 1
          }

          $content = Get-Content `
            $stdafx `
            -Raw

          $pattern = '(?m)^\s*#include\s*[<"]splitter\.h[>"]\s*\r?\n?'

          $patched = [regex]::Replace(
            $content,
            $pattern,
            "// splitter.h omitted: CSplitter is unused by this source tree.`r`n"
          )

          Set-Content `
            -Path $stdafx `
            -Value $patched `
            -Encoding utf8

          Write-Host "Unused splitter.h include removed from CI workspace."


      # ==========================================================
      # 5. Install Boost 1.82.0
      # ==========================================================
      - name: Install Boost 1.82.0
        shell: pwsh
        run: |
          $url = "https://archives.boost.io/release/1.82.0/source/boost_1_82_0.zip"
          $zip = "$env:RUNNER_TEMP\boost_1_82_0.zip"

          $installRoot = "C:\Dev"
          $boostRoot = "C:\Dev\boost"

          Write-Host "Downloading Boost 1.82.0..."

          curl.exe `
            -L `
            --fail `
            --retry 5 `
            --retry-delay 3 `
            -A "Mozilla/5.0" `
            -o $zip `
            $url

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Boost download failed."
            exit 1
          }

          if (-not (Test-Path $zip)) {
            Write-Error "Boost archive was not downloaded."
            exit 1
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $installRoot | Out-Null

          if (Test-Path $boostRoot) {
            Remove-Item `
              -Path $boostRoot `
              -Recurse `
              -Force
          }

          Write-Host "Extracting Boost..."

          Expand-Archive `
            -Path $zip `
            -DestinationPath $installRoot `
            -Force

          $boostHeader = Get-ChildItem `
            -Path $installRoot `
            -Recurse `
            -File `
            -Filter "format.hpp" |
            Where-Object {
              $_.FullName -match '\\boost\\format\.hpp$'
            } |
            Select-Object -First 1

          if (-not $boostHeader) {
            Write-Error "Could not locate Boost after extraction."
            exit 1
          }

          $extractedBoostRoot = $boostHeader.Directory.Parent.FullName

          Write-Host "Detected Boost root:"
          Write-Host $extractedBoostRoot

          Rename-Item `
            -Path $extractedBoostRoot `
            -NewName "boost"

          $finalHeader = "$boostRoot\boost\format.hpp"

          if (-not (Test-Path $finalHeader)) {
            Write-Error "Boost installation failed:"
            Write-Error $finalHeader
            exit 1
          }

          Write-Host ""
          Write-Host "Boost 1.82.0 installed successfully:"

          Get-Item $finalHeader |
            Format-List FullName,Length


      # ==========================================================
      # 6. Setup vcpkg
      # ==========================================================
      - name: Setup vcpkg
        shell: pwsh
        run: |
          $candidatePaths = @(
            "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe",
            "C:\vcpkg\vcpkg.exe"
          )

          $vcpkgExe = $candidatePaths |
            Where-Object {
              $_ -and (Test-Path $_)
            } |
            Select-Object -First 1

          if (-not $vcpkgExe) {
            Write-Host "vcpkg not found on runner. Cloning..."

            $vcpkgRoot = "C:\vcpkg"

            if (Test-Path $vcpkgRoot) {
              Remove-Item `
                -Path $vcpkgRoot `
                -Recurse `
                -Force
            }

            git clone `
              --depth 1 `
              https://github.com/microsoft/vcpkg.git `
              $vcpkgRoot

            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to clone vcpkg."
              exit 1
            }

            & "$vcpkgRoot\bootstrap-vcpkg.bat" `
              -disableMetrics

            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to bootstrap vcpkg."
              exit 1
            }

            $vcpkgExe = "$vcpkgRoot\vcpkg.exe"
          }

          $vcpkgRoot = Split-Path `
            $vcpkgExe `
            -Parent

          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          "VCPKG_EXE=$vcpkgExe" >> $env:GITHUB_ENV

          Write-Host "vcpkg:"
          Write-Host $vcpkgExe

          & $vcpkgExe version


      # ==========================================================
      # 7. Build Cairo static dependencies
      # ==========================================================
      - name: Build Cairo static dependencies
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "Installing Cairo core as x64-windows-static..."

          & $env:VCPKG_EXE `
            install `
            "cairo[core]:x64-windows-static" `
            --disable-metrics

          if ($LASTEXITCODE -ne 0) {
            Write-Error "vcpkg Cairo installation failed."
            exit 1
          }

          $tripletRoot = Join-Path `
            $env:VCPKG_ROOT `
            "installed\x64-windows-static"

          $libRoot = Join-Path `
            $tripletRoot `
            "lib"

          $includeRoot = Join-Path `
            $tripletRoot `
            "include"

          if (-not (Test-Path $libRoot)) {
            Write-Error "vcpkg static library directory not found:"
            Write-Error $libRoot
            exit 1
          }

          if (-not (Test-Path $includeRoot)) {
            Write-Error "vcpkg include directory not found:"
            Write-Error $includeRoot
            exit 1
          }

          $projectInclude = "dependencies\include"
          $projectLib = "dependencies\lib_x64_static"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $projectInclude | Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $projectLib | Out-Null


          # ------------------------------------------------------
          # Copy vcpkg include tree
          # ------------------------------------------------------
          Write-Host ""
          Write-Host "Copying vcpkg headers..."

          Copy-Item `
            -Path "$includeRoot\*" `
            -Destination $projectInclude `
            -Recurse `
            -Force


          # ------------------------------------------------------
          # Legacy iNFekt uses:
          #
          #   #include <cairo-win32.h>
          #
          # vcpkg places Cairo headers in:
          #
          #   include\cairo\cairo-win32.h
          #
          # Flatten the Cairo headers for the legacy source.
          # ------------------------------------------------------
          $cairoHeaderRoot = Join-Path `
            $includeRoot `
            "cairo"

          if (-not (Test-Path $cairoHeaderRoot)) {
            Write-Error "vcpkg Cairo header directory not found:"
            Write-Error $cairoHeaderRoot
            exit 1
          }

          Write-Host ""
          Write-Host "Flattening Cairo headers..."

          $cairoHeaders = Get-ChildItem `
            -Path $cairoHeaderRoot `
            -Filter "*.h" `
            -File

          foreach ($header in $cairoHeaders) {
            Copy-Item `
              -Path $header.FullName `
              -Destination $projectInclude `
              -Force

            Write-Host "Copied Cairo header $($header.Name)"
          }

          $legacyCairoHeader = Join-Path `
            $projectInclude `
            "cairo-win32.h"

          if (-not (Test-Path $legacyCairoHeader)) {
            Write-Error "Legacy Cairo header was not created:"
            Write-Error $legacyCairoHeader
            exit 1
          }

          Write-Host "OK    cairo-win32.h"


          # ------------------------------------------------------
          # Copy static libraries
          # ------------------------------------------------------
          Write-Host ""
          Write-Host "Copying vcpkg static libraries..."

          $libs = Get-ChildItem `
            -Path $libRoot `
            -Filter "*.lib" `
            -File

          if ($libs.Count -eq 0) {
            Write-Error "No static libraries were produced by vcpkg."
            exit 1
          }

          foreach ($lib in $libs) {
            Copy-Item `
              -Path $lib.FullName `
              -Destination $projectLib `
              -Force

            Write-Host "Copied $($lib.Name)"
          }


          # ------------------------------------------------------
          # Normalize zlib filename:
          # vcpkg -> zs.lib
          # iNFekt -> zlib.lib
          # ------------------------------------------------------
          $zs = Join-Path $projectLib "zs.lib"
          $zlib = Join-Path $projectLib "zlib.lib"

          if ((Test-Path $zs) -and (-not (Test-Path $zlib))) {
            Write-Host ""
            Write-Host "Renaming:"
            Write-Host "  zs.lib -> zlib.lib"

            Rename-Item `
              -Path $zs `
              -NewName "zlib.lib"
          }


          # ------------------------------------------------------
          # Normalize Cairo filename:
          # vcpkg -> cairo.lib
          # iNFekt -> cairo-static.lib
          # ------------------------------------------------------
          $cairo = Join-Path $projectLib "cairo.lib"
          $cairoStatic = Join-Path $projectLib "cairo-static.lib"

          if ((Test-Path $cairo) -and (-not (Test-Path $cairoStatic))) {
            Write-Host ""
            Write-Host "Renaming:"
            Write-Host "  cairo.lib -> cairo-static.lib"

            Rename-Item `
              -Path $cairo `
              -NewName "cairo-static.lib"
          }


          # ------------------------------------------------------
          # Validate required libraries
          # ------------------------------------------------------
          $requiredLibs = @(
            "cairo-static.lib",
            "libpng16.lib",
            "zlib.lib",
            "pixman-1.lib"
          )

          $missing = @()

          foreach ($lib in $requiredLibs) {
            $path = Join-Path $projectLib $lib

            if (Test-Path $path) {
              Write-Host "OK    $lib"
            }
            else {
              Write-Host "MISS  $lib"
              $missing += $lib
            }
          }

          if ($missing.Count -gt 0) {
            Write-Error "Required static libraries are missing:"
            Write-Error ($missing -join ", ")
            exit 1
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Cairo static dependency build complete"
          Write-Host "========================================"


      # ==========================================================
      # 8. Patch Release-Static x64 linker dependencies
      # ==========================================================
      - name: Prepare static x64 link libraries
        shell: pwsh
        run: |
          $projectFile = "project\infekt-win32\iNFekt.vcxproj"
          $projectLib = "dependencies\lib_x64_static"

          if (-not (Test-Path $projectFile)) {
            Write-Error "Project file not found:"
            Write-Error $projectFile
            exit 1
          }

          if (-not (Test-Path $projectLib)) {
            Write-Error "Static library directory not found:"
            Write-Error $projectLib
            exit 1
          }

          $libs = Get-ChildItem `
            -Path $projectLib `
            -Filter "*.lib" `
            -File |
            Sort-Object Name |
            ForEach-Object {
              $_.Name
            }

          if ($libs.Count -eq 0) {
            Write-Error "No .lib files found."
            exit 1
          }

          Write-Host ""
          Write-Host "Static libraries to link:"

          $libs | ForEach-Object {
            Write-Host "  $_"
          }

          $systemLibs = @(
            "advapi32.lib",
            "comctl32.lib",
            "gdi32.lib",
            "imm32.lib",
            "kernel32.lib",
            "msimg32.lib",
            "ole32.lib",
            "oleaut32.lib",
            "shlwapi.lib",
            "uxtheme.lib",
            "user32.lib",
            "uuid.lib",
            "winhttp.lib",
            "winmm.lib"
          )

          $allLibs = @(
            $libs
            $systemLibs
            "%(AdditionalDependencies)"
          ) -join ";"

          $xml = Get-Content `
            -Path $projectFile `
            -Raw

          $old = 'comctl32.lib;cairo-static.lib;zlib.lib;shlwapi.lib;uxtheme.lib;winhttp.lib;libpng16.lib;%(AdditionalDependencies)'

          if ($xml.Contains($old)) {
            Write-Host "Replacing original Release-Static dependency list."

            $xml = $xml.Replace(
              $old,
              $allLibs
            )
          }
          else {
            Write-Host "Original dependency list not found."
            Write-Host "Searching Release-Static x64 AdditionalDependencies..."

            $regex = '(?s)(Release-Static\|x64.*?<AdditionalDependencies>).*?(</AdditionalDependencies>)'

            if ($xml -notmatch $regex) {
              Write-Error "Could not locate Release-Static|x64 AdditionalDependencies."
              exit 1
            }

            $xml = [regex]::Replace(
              $xml,
              $regex,
              {
                param($m)

                $m.Groups[1].Value +
                $allLibs +
                $m.Groups[2].Value
              },
              1
            )
          }

          Set-Content `
            -Path $projectFile `
            -Value $xml `
            -Encoding utf8

          Write-Host ""
          Write-Host "Temporary CI VCXPROJ patch completed."


      # ==========================================================
      # 9. Setup MSBuild
      # ==========================================================
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64


      # ==========================================================
      # 10. Build Release-Static x64
      # ==========================================================
      - name: Build iNFekt Release-Static x64
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "Building iNFekt..."
          Write-Host ""

          msbuild `
            project/infekt-win32/iNFekt.vcxproj `
            /m `
            /p:Configuration=Release-Static `
            /p:Platform=x64 `
            /p:PlatformToolset=v143

          if ($LASTEXITCODE -ne 0) {
            Write-Error "MSBuild failed."
            exit 1
          }


      # ==========================================================
      # 11. Verify executable
      # ==========================================================
      - name: Verify executable
        shell: pwsh
        run: |
          $expected = "project\build-out\Release-Static-x64\infekt-win64.exe"

          if (Test-Path $expected) {
            Write-Host ""
            Write-Host "Build succeeded:"

            Get-Item $expected |
              Format-List FullName,Length,LastWriteTime

            exit 0
          }

          Write-Host "Expected executable not found:"
          Write-Host $expected

          Write-Host ""
          Write-Host "Searching project tree..."

          $found = Get-ChildItem `
            -Path "project" `
            -Recurse `
            -File `
            -Filter "infekt-win64.exe"

          if ($found.Count -eq 0) {
            Write-Error "infekt-win64.exe was not produced."
            exit 1
          }

          $found | ForEach-Object {
            Write-Host "Found:"
            Write-Host $_.FullName
          }


      # ==========================================================
      # 12. Package portable ZIP
      # ==========================================================
      - name: Package portable build
        shell: pwsh
        run: |
          $exe = "project\build-out\Release-Static-x64\infekt-win64.exe"
          $outDir = "dist"
          $zip = "dist\iNFekt-win64-portable.zip"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $outDir | Out-Null

          if (-not (Test-Path $exe)) {
            $exe = Get-ChildItem `
              -Path "project" `
              -Recurse `
              -File `
              -Filter "infekt-win64.exe" |
              Select-Object `
                -First 1 `
                -ExpandProperty FullName
          }

          if (-not $exe -or -not (Test-Path $exe)) {
            Write-Error "Could not locate infekt-win64.exe for packaging."
            exit 1
          }

          Write-Host "Packaging:"
          Write-Host $exe

          Compress-Archive `
            -Path $exe `
            -DestinationPath $zip `
            -Force

          Write-Host ""
          Write-Host "Portable package:"

          Get-Item $zip |
            Format-List FullName,Length,LastWriteTime


      # ==========================================================
      # 13. Upload artifact
      # ==========================================================
      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: iNFekt-win64-portable
          path: dist/iNFekt-win64-portable.zip
          if-no-files-found: error
