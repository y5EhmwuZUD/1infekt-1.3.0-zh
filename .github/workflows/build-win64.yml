name: Build iNFekt Win64 Portable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      # ============================================================
      # Checkout
      # ============================================================
      - name: Checkout iNFekt
        uses: actions/checkout@v5

      # ============================================================
      # Verify Win32++
      # ============================================================
      - name: Verify Win32++
        shell: pwsh
        run: |
          $win32xx = "dependencies\include\win32xx"

          Write-Host "Checking Win32++..."
          Write-Host "Directory: $win32xx"

          if (-not (Test-Path $win32xx)) {
            Write-Error "Win32++ directory does not exist:"
            Write-Error $win32xx
            exit 1
          }

          $requiredHeaders = @(
            "wincore.h",
            "dialog.h",
            "docking.h",
            "frame.h",
            "gdi.h",
            "listview.h",
            "mdi.h",
            "propertysheet.h",
            "rebar.h",
            "socket.h",
            "statusbar.h",
            "toolbar.h",
            "treeview.h"
          )

          $missing = @()

          Write-Host ""
          Write-Host "Checking required Win32++ headers..."

          foreach ($header in $requiredHeaders) {
            $path = Join-Path $win32xx $header

            if (Test-Path $path) {
              $size = (Get-Item $path).Length
              Write-Host "OK    $header ($size bytes)"
            }
            else {
              Write-Host "MISS  $header"
              $missing += $header
            }
          }

          if ($missing.Count -gt 0) {
            Write-Error "Required Win32++ headers are missing:"
            Write-Error ($missing -join ", ")
            exit 1
          }

          # splitter.h is handled separately below because this
          # particular iNFekt source tree may only have a stale
          # include for it.
          $splitter = Join-Path $win32xx "splitter.h"

          if (Test-Path $splitter) {
            Write-Host "OK    splitter.h"
            "SPLITTER_PRESENT=true" >> $env:GITHUB_ENV
          }
          else {
            Write-Host "INFO  splitter.h is not present"
            "SPLITTER_PRESENT=false" >> $env:GITHUB_ENV
          }

          Write-Host ""
          Write-Host "Win32++ base headers verified."

      # ============================================================
      # Handle splitter.h
      #
      # If splitter.h is missing, determine whether the actual
      # iNFekt source uses CSplitter.
      #
      # If only stdafx.h includes splitter.h and CSplitter is not
      # actually used, remove that stale include in the runner
      # workspace.
      #
      # The repository itself is NOT modified.
      # ============================================================
      - name: Handle missing splitter.h
        shell: pwsh
        run: |
          if ($env:SPLITTER_PRESENT -eq "true") {
            Write-Host "splitter.h exists. No patch required."
            exit 0
          }

          Write-Host "splitter.h is missing."
          Write-Host "Checking whether iNFekt actually uses CSplitter..."

          $sourceRoot = Join-Path $PWD "src"

          if (-not (Test-Path $sourceRoot)) {
            Write-Error "Source directory not found: $sourceRoot"
            exit 1
          }

          # Search for actual CSplitter references.
          $splitterUsage = Get-ChildItem `
            -Path $sourceRoot `
            -Recurse `
            -File `
            -Include *.h,*.hpp,*.c,*.cc,*.cpp |
            Select-String `
              -Pattern '\bCSplitter\b' `
              -CaseSensitive `
              -SimpleMatch:$false

          # Remove matches that would only come from the expected
          # Win32++ include line in stdafx.h.
          $actualUsage = @(
            $splitterUsage | Where-Object {
              -not (
                $_.Path.EndsWith("stdafx.h") -and
                $_.Line -match '#include\s*[<"]splitter\.h[>"]'
              )
            }
          )

          if ($actualUsage.Count -gt 0) {
            Write-Host ""
            Write-Host "CSplitter usage was found:"
            $actualUsage | ForEach-Object {
              Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())"
            }

            Write-Error ""
            Write-Error "splitter.h is required by the source code."
            Write-Error "Do not remove the splitter.h include."
            Write-Error "The correct Win32++ splitter.h must be added to the repository."
            exit 1
          }

          # We know the current source only references splitter.h
          # through the precompiled header, so test whether the
          # include exists there.
          $stdafx = Join-Path $PWD "src\win32\stdafx.h"

          if (-not (Test-Path $stdafx)) {
            Write-Error "stdafx.h not found: $stdafx"
            exit 1
          }

          $content = Get-Content `
            -Path $stdafx `
            -Raw

          $pattern = '(?m)^\s*#include\s*[<"]splitter\.h[>"]\s*\r?\n?'

          if ($content -notmatch $pattern) {
            Write-Error "stdafx.h does not contain the expected splitter.h include."
            exit 1
          }

          $patched = [regex]::Replace(
            $content,
            $pattern,
            "// splitter.h is not included because this source tree does not use CSplitter.`r`n"
          )

          Set-Content `
            -Path $stdafx `
            -Value $patched `
            -Encoding utf8

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Removed unused splitter.h include"
          Write-Host "from the temporary CI workspace."
          Write-Host "========================================"

          Write-Host ""
          Write-Host "Current stdafx.h Win32++ section:"
          Get-Content $stdafx |
            Select-Object -First 40

      # ============================================================
      # Install Boost 1.82.0
      # ============================================================
      - name: Install Boost 1.82.0
        shell: pwsh
        run: |
          $url = "https://archives.boost.io/release/1.82.0/source/boost_1_82_0.zip"
          $zip = "$env:RUNNER_TEMP\boost_1_82_0.zip"
          $installRoot = "C:\Dev"
          $boostRoot = "C:\Dev\boost"

          Write-Host "Downloading Boost 1.82.0..."

          curl.exe `
            -L `
            --fail `
            --retry 5 `
            --retry-delay 3 `
            -A "Mozilla/5.0" `
            -o $zip `
            $url

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Boost download failed."
            exit 1
          }

          if (-not (Test-Path $zip)) {
            Write-Error "Boost archive was not downloaded."
            exit 1
          }

          $size = (Get-Item $zip).Length

          Write-Host "Boost archive size: $size bytes"

          if ($size -lt 1000000) {
            Write-Error "Boost archive is unexpectedly small."
            exit 1
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $installRoot | Out-Null

          Write-Host "Extracting Boost..."

          Expand-Archive `
            -Path $zip `
            -DestinationPath $installRoot `
            -Force

          if (-not (Test-Path "$boostRoot\boost")) {
            Write-Error "Boost directory not found:"
            Write-Error "$boostRoot\boost"
            exit 1
          }

          if (-not (Test-Path "$boostRoot\boost\format.hpp")) {
            Write-Error "Boost format.hpp was not found."
            exit 1
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Boost 1.82.0 installed successfully"
          Write-Host "========================================"

          Get-Item "$boostRoot\boost\format.hpp" |
            Format-List FullName,Length

      # ============================================================
      # Verify bundled iNFekt libraries
      # ============================================================
      - name: Verify iNFekt dependencies
        shell: pwsh
        run: |
          $includeDir = "dependencies\include"
          $libDir = "dependencies\lib_x64_static"

          if (-not (Test-Path $includeDir)) {
            Write-Error "Missing directory: $includeDir"
            exit 1
          }

          if (-not (Test-Path $libDir)) {
            Write-Error "Missing directory: $libDir"
            exit 1
          }

          $requiredLibs = @(
            "cairo-static.lib",
            "libpng16.lib",
            "zlib.lib"
          )

          $missing = @()

          Write-Host ""
          Write-Host "Checking static libraries..."

          foreach ($lib in $requiredLibs) {
            $path = Join-Path $libDir $lib

            if (Test-Path $path) {
              $size = (Get-Item $path).Length
              Write-Host "OK    $lib ($size bytes)"
            }
            else {
              Write-Host "MISS  $lib"
              $missing += $lib
            }
          }

          if ($missing.Count -gt 0) {
            Write-Error "Missing static libraries:"
            Write-Error ($missing -join ", ")
            exit 1
          }

          Write-Host ""
          Write-Host "All bundled libraries are present."

      # ============================================================
      # Setup MSBuild
      # ============================================================
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      # ============================================================
      # Build
      # ============================================================
      - name: Build iNFekt
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "Building iNFekt"
          Write-Host "Configuration : Release-Static"
          Write-Host "Platform      : x64"
          Write-Host "Toolset       : v143"
          Write-Host "========================================"

          msbuild `
            project/infekt-win32/iNFekt.vcxproj `
            /m `
            /p:Configuration=Release-Static `
            /p:Platform=x64 `
            /p:PlatformToolset=v143 `
            /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
            Write-Error "MSBuild failed."
            exit 1
          }

      # ============================================================
      # Verify executable
      # ============================================================
      - name: Verify build
        shell: pwsh
        run: |
          $exe = "project\build-out\Release-Static-x64\infekt-win64.exe"

          Write-Host ""
          Write-Host "Checking executable:"
          Write-Host $exe

          if (-not (Test-Path $exe)) {
            Write-Error "infekt-win64.exe was not produced."

            Write-Host ""
            Write-Host "Build output tree:"

            $outputDir = "project\build-out"

            if (Test-Path $outputDir) {
              Get-ChildItem `
                -Path $outputDir `
                -Recurse `
                -File |
                Select-Object FullName,Length
            }

            exit 1
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "BUILD SUCCESSFUL"
          Write-Host "========================================"

          Get-Item $exe |
            Format-List FullName,Length

      # ============================================================
      # Package portable ZIP
      # ============================================================
      - name: Package portable ZIP
        shell: pwsh
        run: |
          $src = "project\build-out\Release-Static-x64"
          $zip = "iNFekt-win64-portable.zip"

          if (-not (Test-Path "$src\infekt-win64.exe")) {
            Write-Error "Executable not found:"
            Write-Error "$src\infekt-win64.exe"
            exit 1
          }

          Write-Host ""
          Write-Host "Packaging:"
          Write-Host $src
          Write-Host ""
          Write-Host "Output:"
          Write-Host $zip

          Compress-Archive `
            -Path "$src\*" `
            -DestinationPath $zip `
            -Force

          if (-not (Test-Path $zip)) {
            Write-Error "Failed to create portable ZIP."
            exit 1
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "PORTABLE PACKAGE CREATED"
          Write-Host "========================================"

          Get-Item $zip |
            Format-List FullName,Length

      # ============================================================
      # Upload artifact
      # ============================================================
      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: iNFekt-win64-portable
          path: iNFekt-win64-portable.zip
          if-no-files-found: error
