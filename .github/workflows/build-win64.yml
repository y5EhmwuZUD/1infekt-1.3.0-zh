name: Build iNFekt Win64 Portable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v5

      # ==========================================================
      # 2. Verify Win32++ 7.x headers
      # ==========================================================
      - name: Verify Win32++
        shell: pwsh
        run: |
          $win32xx = "dependencies\include\win32xx"

          Write-Host "Checking Win32++..."
          Write-Host "Directory: $win32xx"

          if (-not (Test-Path $win32xx)) {
            Write-Error "Win32++ directory does not exist:"
            Write-Error $win32xx
            exit 1
          }

          $requiredHeaders = @(
            "wincore.h",
            "dialog.h",
            "docking.h",
            "frame.h",
            "gdi.h",
            "listview.h",
            "mdi.h",
            "propertysheet.h",
            "rebar.h",
            "socket.h",
            "statusbar.h",
            "toolbar.h",
            "treeview.h"
          )

          $missing = @()

          foreach ($header in $requiredHeaders) {
            $path = Join-Path $win32xx $header

            if (Test-Path $path) {
              $size = (Get-Item $path).Length
              Write-Host "OK    $header ($size bytes)"
            }
            else {
              Write-Host "MISS  $header"
              $missing += $header
            }
          }

          if ($missing.Count -gt 0) {
            Write-Error "Missing Win32++ headers:"
            Write-Error ($missing -join ", ")
            exit 1
          }

          $splitter = Join-Path $win32xx "splitter.h"

          if (Test-Path $splitter) {
            Write-Host "OK    splitter.h"
            "SPLITTER_PRESENT=true" >> $env:GITHUB_ENV
          }
          else {
            Write-Host "INFO  splitter.h is not present"
            "SPLITTER_PRESENT=false" >> $env:GITHUB_ENV
          }

          Write-Host ""
          Write-Host "Win32++ verification successful."

      # ==========================================================
      # 3. Remove unused splitter.h include from CI workspace
      # ==========================================================
      - name: Handle missing splitter.h
        shell: pwsh
        run: |
          if ($env:SPLITTER_PRESENT -eq "true") {
            Write-Host "splitter.h exists. No patch required."
            exit 0
          }

          Write-Host "splitter.h is missing."
          Write-Host "Checking whether CSplitter is actually used..."

          $sourceRoot = Join-Path $PWD "src"

          $splitterUsage = Get-ChildItem `
            -Path $sourceRoot `
            -Recurse `
            -File `
            -Include *.h,*.hpp,*.c,*.cc,*.cpp |
            Select-String `
              -Pattern '\bCSplitter\b' `
              -CaseSensitive `
              -SimpleMatch:$false

          $actualUsage = @(
            $splitterUsage | Where-Object {
              -not (
                $_.Path.EndsWith("stdafx.h") -and
                $_.Line -match '#include\s*[<"]splitter\.h[>"]'
              )
            }
          )

          if ($actualUsage.Count -gt 0) {
            Write-Host ""
            Write-Host "CSplitter usage found:"

            $actualUsage | ForEach-Object {
              Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())"
            }

            Write-Error "splitter.h is actually required by the source."
            exit 1
          }

          $stdafx = "src\win32\stdafx.h"

          if (-not (Test-Path $stdafx)) {
            Write-Error "stdafx.h not found."
            exit 1
          }

          $content = Get-Content $stdafx -Raw

          $pattern = '(?m)^\s*#include\s*[<"]splitter\.h[>"]\s*\r?\n?'

          $patched = [regex]::Replace(
            $content,
            $pattern,
            "// splitter.h omitted: CSplitter is unused by this source tree.`r`n"
          )

          Set-Content `
            -Path $stdafx `
            -Value $patched `
            -Encoding utf8

          Write-Host "Unused splitter.h include removed from CI workspace."

      # ==========================================================
      # 4. Install Boost 1.82.0
      # ==========================================================
      - name: Install Boost 1.82.0
        shell: pwsh
        run: |
          $url = "https://archives.boost.io/release/1.82.0/source/boost_1_82_0.zip"
          $zip = "$env:RUNNER_TEMP\boost_1_82_0.zip"

          $installRoot = "C:\Dev"
          $boostRoot = "C:\Dev\boost"

          Write-Host "Downloading Boost 1.82.0..."

          curl.exe `
            -L `
            --fail `
            --retry 5 `
            --retry-delay 3 `
            -A "Mozilla/5.0" `
            -o $zip `
            $url

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Boost download failed."
            exit 1
          }

          if (-not (Test-Path $zip)) {
            Write-Error "Boost archive was not downloaded."
            exit 1
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $installRoot | Out-Null

          if (Test-Path $boostRoot) {
            Remove-Item `
              -Path $boostRoot `
              -Recurse `
              -Force
          }

          Write-Host "Extracting Boost..."

          Expand-Archive `
            -Path $zip `
            -DestinationPath $installRoot `
            -Force

          $boostHeader = Get-ChildItem `
            -Path $installRoot `
            -Recurse `
            -File `
            -Filter "format.hpp" |
            Where-Object {
              $_.FullName -match '\\boost\\format\.hpp$'
            } |
            Select-Object -First 1

          if (-not $boostHeader) {
            Write-Error "Could not locate Boost after extraction."
            exit 1
          }

          $extractedBoostRoot = $boostHeader.Directory.Parent.FullName

          Write-Host "Detected Boost root:"
          Write-Host $extractedBoostRoot

          Rename-Item `
            -Path $extractedBoostRoot `
            -NewName "boost"

          $finalHeader = "$boostRoot\boost\format.hpp"

          if (-not (Test-Path $finalHeader)) {
            Write-Error "Boost installation failed."
            Write-Error $finalHeader
            exit 1
          }

          Write-Host ""
          Write-Host "Boost 1.82.0 installed successfully:"
          Get-Item $finalHeader |
            Format-List FullName,Length

      # ==========================================================
      # 5. Install / locate vcpkg
      # ==========================================================
      - name: Setup vcpkg
        shell: pwsh
        run: |
          $candidatePaths = @(
            "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe",
            "C:\vcpkg\vcpkg.exe"
          )

          $vcpkgExe = $candidatePaths |
            Where-Object {
              $_ -and (Test-Path $_)
            } |
            Select-Object -First 1

          if (-not $vcpkgExe) {
            Write-Host "vcpkg not found on runner. Cloning..."

            $vcpkgRoot = "C:\vcpkg"

            if (Test-Path $vcpkgRoot) {
              Remove-Item `
                -Path $vcpkgRoot `
                -Recurse `
                -Force
            }

            git clone `
              --depth 1 `
              https://github.com/microsoft/vcpkg.git `
              $vcpkgRoot

            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to clone vcpkg."
              exit 1
            }

            & "$vcpkgRoot\bootstrap-vcpkg.bat" `
              -disableMetrics

            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to bootstrap vcpkg."
              exit 1
            }

            $vcpkgExe = "$vcpkgRoot\vcpkg.exe"
          }

          $vcpkgRoot = Split-Path `
            $vcpkgExe `
            -Parent

          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          "VCPKG_EXE=$vcpkgExe" >> $env:GITHUB_ENV

          Write-Host "vcpkg:"
          Write-Host $vcpkgExe

          & $vcpkgExe version

      # ==========================================================
      # 6. Build Cairo + static dependencies
      # ==========================================================
      - name: Build Cairo static dependencies
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "Installing Cairo core as x64-windows-static..."

          & $env:VCPKG_EXE `
            install `
            "cairo[core]:x64-windows-static" `
            --disable-metrics

          if ($LASTEXITCODE -ne 0) {
            Write-Error "vcpkg Cairo installation failed."
            exit 1
          }

          $tripletRoot = Join-Path `
            $env:VCPKG_ROOT `
            "installed\x64-windows-static"

          $libRoot = Join-Path $tripletRoot "lib"
          $includeRoot = Join-Path $tripletRoot "include"

          if (-not (Test-Path $libRoot)) {
            Write-Error "vcpkg static library directory not found:"
            Write-Error $libRoot
            exit 1
          }

          if (-not (Test-Path $includeRoot)) {
            Write-Error "vcpkg include directory not found:"
            Write-Error $includeRoot
            exit 1
          }

          $projectInclude = "dependencies\include"
          $projectLib = "dependencies\lib_x64_static"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $projectInclude | Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $projectLib | Out-Null

          # ------------------------------------------------------
          # Copy all headers
          # ------------------------------------------------------
          Write-Host ""
          Write-Host "Copying vcpkg headers..."

          Copy-Item `
            -Path "$includeRoot\*" `
            -Destination $projectInclude `
            -Recurse `
            -Force

          # ------------------------------------------------------
          # Copy all release static libraries
          # ------------------------------------------------------
          Write-Host ""
          Write-Host "Copying vcpkg static libraries..."

          $libs = Get-ChildItem `
            -Path $libRoot `
            -Filter "*.lib" `
            -File

          if ($libs.Count -eq 0) {
            Write-Error "No static libraries were produced by vcpkg."
            exit 1
          }

          foreach ($lib in $libs) {
            Copy-Item `
              -Path $lib.FullName `
              -Destination $projectLib `
              -Force

            Write-Host "Copied $($lib.Name)"
          }

          # ------------------------------------------------------
          # vcpkg currently emits zlib as zs.lib.
          #
          # The old iNFekt project expects zlib.lib.
          # Normalize the filename for the legacy VCXPROJ.
          # ------------------------------------------------------
          $zs = Join-Path $projectLib "zs.lib"
          $zlib = Join-Path $projectLib "zlib.lib"

          if ((Test-Path $zs) -and (-not (Test-Path $zlib))) {
            Write-Host ""
            Write-Host "Renaming vcpkg zlib library:"
            Write-Host "  zs.lib -> zlib.lib"

            Rename-Item `
              -Path $zs `
              -NewName "zlib.lib"
          }

          # ------------------------------------------------------
          # The iNFekt VCXPROJ expects cairo-static.lib.
          # vcpkg produces cairo.lib.
          # ------------------------------------------------------
          $cairo = Join-Path $projectLib "cairo.lib"
          $cairoStatic = Join-Path $projectLib "cairo-static.lib"

          if ((Test-Path $cairo) -and (-not (Test-Path $cairoStatic))) {
            Rename-Item `
              -Path $cairo `
              -NewName "cairo-static.lib"
          }

          Write-Host ""
          Write-Host "Static libraries now present:"
          Get-ChildItem `
            -Path $projectLib `
            -Filter "*.lib" `
            -File |
            Sort-Object Name |
            ForEach-Object {
              Write-Host "  $($_.Name)"
            }

          # ------------------------------------------------------
          # Verify required legacy names
          # ------------------------------------------------------
          $requiredLibs = @(
            "cairo-static.lib",
            "libpng16.lib",
            "zlib.lib",
            "pixman-1.lib"
          )

          $missing = @()

          foreach ($lib in $requiredLibs) {
            $path = Join-Path $projectLib $lib

            if (Test-Path $path) {
              Write-Host "OK    $lib"
            }
            else {
              Write-Host "MISS  $lib"
              $missing += $lib
            }
          }

          if ($missing.Count -gt 0) {
            Write-Error "Required static libraries are missing:"
            Write-Error ($missing -join ", ")
            exit 1
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Cairo static dependency build complete"
          Write-Host "========================================"

      # ==========================================================
      # 7. Patch Release-Static x64 linker dependencies
      # ==========================================================
      - name: Prepare static x64 link libraries
        shell: pwsh
        run: |
          $projectFile = "project\infekt-win32\iNFekt.vcxproj"
          $projectLib = "dependencies\lib_x64_static"

          if (-not (Test-Path $projectFile)) {
            Write-Error "Project file not found:"
            Write-Error $projectFile
            exit 1
          }

          if (-not (Test-Path $projectLib)) {
            Write-Error "Static library directory not found:"
            Write-Error $projectLib
            exit 1
          }

          $libs = Get-ChildItem `
            -Path $projectLib `
            -Filter "*.lib" `
            -File |
            Sort-Object Name |
            ForEach-Object { $_.Name }

          if ($libs.Count -eq 0) {
            Write-Error "No .lib files found in $projectLib"
            exit 1
          }

          Write-Host ""
          Write-Host "Static libraries to link:"
          $libs | ForEach-Object {
            Write-Host "  $_"
          }

          $systemLibs = @(
            "advapi32.lib",
            "comctl32.lib",
            "gdi32.lib",
            "imm32.lib",
            "kernel32.lib",
            "msimg32.lib",
            "ole32.lib",
            "oleaut32.lib",
            "shlwapi.lib",
            "uxtheme.lib",
            "user32.lib",
            "uuid.lib",
            "winhttp.lib",
            "winmm.lib"
          )

          $allLibs = @(
            $libs
            $systemLibs
            "%(AdditionalDependencies)"
          ) -join ";"

          $xml = Get-Content `
            -Path $projectFile `
            -Raw

          $old = 'comctl32.lib;cairo-static.lib;zlib.lib;shlwapi.lib;uxtheme.lib;winhttp.lib;libpng16.lib;%(AdditionalDependencies)'

          if (-not $xml.Contains($old)) {
            Write-Host "Original Release-Static x64 dependency list was not found."

            $regex = '(?s)(Release-Static\|x64.*?<AdditionalDependencies>).*?(</AdditionalDependencies>)'

            if ($xml -notmatch $regex) {
              Write-Error "Could not locate Release-Static|x64 AdditionalDependencies."
              exit 1
            }

            $xml = [regex]::Replace(
              $xml,
              $regex,
              {
                param($m)
                $m.Groups[1].Value + $allLibs + $m.Groups[2].Value
              },
              1
            )
          }
          else {
            Write-Host "Replacing original Release-Static x64 dependency list."

            $xml = $xml.Replace(
              $old,
              $allLibs
            )
          }

          Set-Content `
            -Path $projectFile `
            -Value $xml `
            -Encoding utf8

          Write-Host ""
          Write-Host "Temporary CI VCXPROJ patch completed."

      # ==========================================================
      # 8. Setup MSBuild
      # ==========================================================
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      # ==========================================================
      # 9. Build Release-Static x64
      # ==========================================================
      - name: Build iNFekt Release-Static x64
        shell: pwsh
        run: |
          Write-Host "Building iNFekt..."

          msbuild `
            project/infekt-win32/iNFekt.vcxproj `
            /m `
            /p:Configuration=Release-Static `
            /p:Platform=x64 `
            /p:PlatformToolset=v143

          if ($LASTEXITCODE -ne 0) {
            Write-Error "MSBuild failed."
            exit 1
          }

      # ==========================================================
      # 10. Locate executable
      # ==========================================================
      - name: Verify executable
        shell: pwsh
        run: |
          $expected = "project\build-out\Release-Static-x64\infekt-win64.exe"

          if (Test-Path $expected) {
            Write-Host ""
            Write-Host "Build succeeded:"
            Get-Item $expected |
              Format-List FullName,Length,LastWriteTime
            exit 0
          }

          Write-Host "Expected executable not found:"
          Write-Host $expected

          Write-Host ""
          Write-Host "Searching project tree..."

          $found = Get-ChildItem `
            -Path "project" `
            -Recurse `
            -File `
            -Filter "infekt-win64.exe"

          if ($found.Count -eq 0) {
            Write-Error "infekt-win64.exe was not produced."
            exit 1
          }

          $found | ForEach-Object {
            Write-Host "Found:"
            Write-Host $_.FullName
          }

      # ==========================================================
      # 11. Package portable ZIP
      # ==========================================================
      - name: Package portable build
        shell: pwsh
        run: |
          $exe = "project\build-out\Release-Static-x64\infekt-win64.exe"
          $outDir = "dist"
          $zip = "dist\iNFekt-win64-portable.zip"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $outDir | Out-Null

          if (-not (Test-Path $exe)) {
            $exe = Get-ChildItem `
              -Path "project" `
              -Recurse `
              -File `
              -Filter "infekt-win64.exe" |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $exe -or -not (Test-Path $exe)) {
            Write-Error "Could not locate infekt-win64.exe for packaging."
            exit 1
          }

          Write-Host "Packaging:"
          Write-Host $exe

          Compress-Archive `
            -Path $exe `
            -DestinationPath $zip `
            -Force

          Write-Host ""
          Write-Host "Portable package:"
          Get-Item $zip |
            Format-List FullName,Length,LastWriteTime

      # ==========================================================
      # 12. Upload artifact
      # ==========================================================
      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: iNFekt-win64-portable
          path: dist/iNFekt-win64-portable.zip
          if-no-files-found: error
